# Bundled stack: the bot + a self-hosted telegram-bot-api server.
# Get TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org.
# Edit the values below and `docker compose up -d`.

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "1234567"
      TELEGRAM_API_HASH: "0123456789abcdef0123456789abcdef"
    volumes:
      - ./data/bot-api:/var/lib/telegram-bot-api
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bot:
    image: ghcr.io/zp-bots-telegram/tg-photo-resize-bot:latest
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      TG_BOT_KEY: "123456789:AAEXAMPLEbotapitokenfromBotFather"
      TG_API_URL: http://telegram-bot-api:8081
      TG_MAX_INPUT_BYTES: "52428800"
