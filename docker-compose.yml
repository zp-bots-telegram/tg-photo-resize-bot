# Bundled stack: the bot + a self-hosted telegram-bot-api server.
#
# Running our own bot-api server lifts the 20 MB getFile limit (up to
# 2 GB), removes api.telegram.org rate limits, and gives faster file
# transfers — see README for the full picture.
#
# Setup:
#   1. Get an API ID / hash from https://my.telegram.org → "API development tools".
#   2. Copy .env.example to .env and fill in TG_BOT_KEY, TELEGRAM_API_ID,
#      TELEGRAM_API_HASH.
#   3. If the bot is currently running against api.telegram.org, call
#      logOut once so updates don't get split between servers:
#        curl "https://api.telegram.org/bot${TG_BOT_KEY}/logOut"
#   4. docker compose up -d
#
# To revert to cloud Bot API: stop the stack, call logOut on the local
# server, then restart the bot with TG_API_URL unset.

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      # Set TELEGRAM_LOCAL=1 if you want the bot to read files directly
      # from a shared volume (skip HTTP). Requires the volume mount on
      # the `bot` service to be uncommented too.
      # TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    image: ghcr.io/zp-bots-telegram/tg-photo-resize-bot:latest
    # For local development against your working copy, comment out
    # `image:` and uncomment the next line:
    # build: .
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_started
    environment:
      TG_BOT_KEY: ${TG_BOT_KEY:?Set TG_BOT_KEY in .env}
      TG_API_URL: http://telegram-bot-api:8081
      # Raise to take advantage of the lifted getFile limit. 50 MB is
      # a sane default; bump higher if your users actually hit it.
      # Beware: a 200 MB HEIC can decode to >1 GB in libvips.
      TG_MAX_INPUT_BYTES: "52428800"
    # If TELEGRAM_LOCAL=1 above, mount the data volume here read-only
    # too so the bot can read files directly from disk:
    # volumes:
    #   - tg-bot-api-data:/var/lib/telegram-bot-api:ro

volumes:
  tg-bot-api-data:
